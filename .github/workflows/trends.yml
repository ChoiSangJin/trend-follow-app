name: Refresh Malmun briefing
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend-feed
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: bash scripts/check_command.sh python3 scripts/collect_briefing.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/briefing.json data/briefing-v3.json data/briefing-v4.json data/briefing-v5.json data/trends-v1.json data/trends-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh dated Korean conversation briefing'
          git push origin HEAD:main
