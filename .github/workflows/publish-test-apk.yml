name: Publish tested APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v2.0.0
      run_id:
        description: Successful validation run containing malmun-debug-arm64
        required: true
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tested-apk-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Match tested app source to the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run_id = os.environ['RUN_ID']
          if not run_id.isdigit():
              raise SystemExit('Run ID must be numeric')
          run = json.loads(subprocess.check_output(['gh', 'api',
              f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          if (run['conclusion'] != 'success' or run['path'] != '.github/workflows/ci.yml'
                  or run['head_branch'] != 'main' or run['event'] not in ('push', 'workflow_dispatch')):
              raise SystemExit('A successful main app validation run is required')
          # Compare every APK input; server feeds and editorial scripts deploy independently.
          subprocess.run(['git', 'diff', '--exit-code', run['head_sha'], 'HEAD',
                          '--', 'lib', 'android', 'assets', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml'], check=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: malmun-debug-arm64
          path: tested-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@v4
        with:
          path: android/.test-signing/debug.keystore
          key: malmun-managed-test-signing-v1
      - name: Verify signature, app identity and ARM64 architecture
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/check_command.sh bash -euo pipefail <<'VERIFY_APK'
          APK=tested-apk/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/malmun-badging.txt
          gh release download v2.0.0 --pattern Malmun-arm64.apk --dir previous-apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > /tmp/malmun-current-cert.txt
          "$BUILD_TOOLS/apksigner" verify --print-certs previous-apk/Malmun-arm64.apk > /tmp/malmun-previous-cert.txt
          if [ -f android/.test-signing/debug.keystore ]; then
            keytool -exportcert -keystore android/.test-signing/debug.keystore -storepass android \
              -alias androiddebugkey -file /tmp/malmun-managed-public.der
          fi
          python3 - <<'PY'
          import zipfile, os, re, hashlib
          from pathlib import Path
          managed = Path('/tmp/malmun-managed-public.der')
          print('Managed key public certificate SHA256:', hashlib.sha256(managed.read_bytes()).hexdigest() if managed.exists() else 'cache not restored')
          pattern = r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)'
          current = re.search(pattern, Path('/tmp/malmun-current-cert.txt').read_text())
          previous = re.search(pattern, Path('/tmp/malmun-previous-cert.txt').read_text())
          if not current or not previous:
              print('Current APK public certificate:', Path('/tmp/malmun-current-cert.txt').read_text())
              print('Previous APK public certificate:', Path('/tmp/malmun-previous-cert.txt').read_text())
              raise SystemExit('Cannot parse APK certificate fingerprints')
          if current.group(1).lower() != previous.group(1).lower():
              print('Current certificate SHA256:', current.group(1))
              print('Previous certificate SHA256:', previous.group(1))
              raise SystemExit('Update signing certificate differs from Malmun v2.0.0')
          badging = Path('/tmp/malmun-badging.txt').read_text()
          version = re.search(r'^version: ([^+\s]+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          required = ["package: name='com.malmun.app'", "application-label:'말문'",
                      "sdkVersion:'24'", f"versionName='{version}'"]
          if any(value not in badging for value in required) or os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('APK identity, version or minimum Android version mismatch')
          with zipfile.ZipFile('tested-apk/app-debug.apk') as apk:
              abis = {name.split('/')[1] for name in apk.namelist()
                      if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Unexpected APK architectures: {abis}')
          PY
          cp "$APK" Malmun-arm64.apk
          sha256sum Malmun-arm64.apk > SHA256SUMS
          VERIFY_APK
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" Malmun-arm64.apk SHA256SUMS docs/INSTALL.md \
            --verify-tag --prerelease --title "말문 $RELEASE_TAG · 테스트 APK" \
            --notes '말문 — 오늘의 스몰토크. 최근 기사에서 선별한 대화 소재, 출처와 기사 날짜, 대화 질문, 보관함과 오프라인 연습을 제공합니다. Android 7.0+ ARM64용 개발용 서명 APK입니다. Follow MZ와 다른 앱 ID이므로 별도로 설치됩니다. 체크섬 파일을 함께 제공합니다.'
