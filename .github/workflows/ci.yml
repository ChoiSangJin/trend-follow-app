name: Validate Android app
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash scripts/check_flutter.sh analyze --fatal-infos
      - run: bash scripts/check_flutter.sh test --reporter expanded --coverage
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: bash scripts/check_flutter.sh build apk --debug --target-platform=android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: follow-mz-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
