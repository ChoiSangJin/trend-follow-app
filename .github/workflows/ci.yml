name: Validate Android app
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: android/.test-signing/debug.keystore
          key: malmun-managed-test-signing-v1
      - name: Prepare reusable test signing identity
        run: bash scripts/prepare_test_key.sh
      - run: flutter pub get --enforce-lockfile
      - run: bash scripts/check_flutter.sh analyze --fatal-infos
      - run: bash scripts/check_flutter.sh test --reporter expanded --coverage
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify live Korean Netflix sources
        if: github.ref == 'refs/heads/main'
        run: bash scripts/check_command.sh python3 scripts/collect_netflix.py
      - run: bash scripts/check_flutter.sh build apk --debug --target-platform=android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: malmun-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: malmun-build-metadata
          path: |
            pubspec.lock
            data/netflix-kr-v1.json
            data/briefing.json
            data/briefing-v3.json
            data/briefing-v4.json
            data/briefing-v5.json
            data/trends-v1.json
            data/trends-history.json
          if-no-files-found: error
