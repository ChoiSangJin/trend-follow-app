name: Release ARM64 APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (optional when running on the tag)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Require a main branch commit and a valid version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version: ([^+\s]+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match pubspec.yaml version')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash scripts/check_flutter.sh analyze --fatal-infos
      - run: bash scripts/check_flutter.sh test --reporter expanded
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Prepare persistent release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          names = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four ANDROID_* signing secrets listed in README.md')
          key = Path(os.environ['RUNNER_TEMP']) / 'follow-mz-release.jks'
          key.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE'].split()), validate=True))
          key.chmod(0o600)
          # Fail before SDK installation/compilation without exposing tool output.
          def verify_key(arguments, message):
              result = subprocess.run(['keytool', '-list', '-keystore', str(key),
                  '-storepass:env', 'STORE_PASSWORD', *arguments],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if result.returncode:
                  print(f'::error title=Release signing configuration::{message}')
                  raise SystemExit(1)
          verify_key([], 'Cannot open ANDROID_KEYSTORE_BASE64 with ANDROID_KEYSTORE_PASSWORD. Check the matching keystore/password pair in GitHub Secrets; do not share values in chat.')
          verify_key(['-alias', os.environ['KEY_ALIAS']], 'ANDROID_KEY_ALIAS does not identify an entry in the configured keystore.')
          def escape(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u' + encoded[i:i+2].hex()
                             for i in range(0, len(encoded), 2))
          values = {'storeFile': str(key), 'storePassword': os.environ['STORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          config = Path('android/key.properties')
          config.write_text(''.join(f'{k}={escape(v)}\n' for k,v in values.items()))
          config.chmod(0o600)
          PY
      - name: Build signed ARM64 release
        run: |
          if bash scripts/check_flutter.sh build apk --release --split-per-abi --target-platform=android-arm64 > "$RUNNER_TEMP/release-build.log" 2>&1; then
            cat "$RUNNER_TEMP/release-build.log"
          else
            cat "$RUNNER_TEMP/release-build.log"
            python3 - <<'PYERROR'
          import os
          from pathlib import Path
          message = (Path(os.environ['RUNNER_TEMP']) / 'release-build.log').read_text(errors='replace')[-3000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Release build failure tail::{message}')
          PYERROR
            exit 1
          fi
      - name: Verify APK signature and ABI
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/release-cert.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/release-badging.txt"
          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          version, code = re.search(r'^version: ([^+\s]+)\+(\d+)', Path('pubspec.yaml').read_text(), re.M).groups()
          badging = (Path(os.environ['RUNNER_TEMP']) / 'release-badging.txt').read_text()
          required = ["package: name='com.malmun.app'", "application-label:'말문'",
                      "sdkVersion:'24'", f"versionName='{version}'", f"versionCode='{code}'"]
          if any(value not in badging for value in required) or 'application-debuggable' in badging:
              raise SystemExit('APK identity, version, SDK or release-mode mismatch')
          cert = (Path(os.environ['RUNNER_TEMP']) / 'release-cert.txt').read_text()
          fingerprints = {value.lower() for value in re.findall(
              r'certificate SHA-256 digest:[ \t]*([0-9a-fA-F]{64})(?![0-9a-fA-F])', cert, re.I)}
          if len(fingerprints) != 1:
              raise SystemExit('Expected exactly one release signing certificate')
          fingerprint = next(iter(fingerprints))
          compatible = fingerprint == '1cdc0b267875f37d8b6e47a08a9abda9394be0cc8f7be15270a80967536d3d09'
          Path('SIGNING.txt').write_text(f'Certificate SHA-256: {fingerprint}\n'
              f'Matches previous managed test signing certificate: {compatible}\n')
          print(Path('SIGNING.txt').read_text())
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk') as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Unexpected APK ABIs: {abis}')
          PY
          cp "$APK" Malmun-arm64-v8a.apk
          sha256sum Malmun-arm64-v8a.apk > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" Malmun-arm64-v8a.apk SHA256SUMS SIGNING.txt docs/INSTALL-RELEASE.md \
            --verify-tag --title "말문 $RELEASE_TAG" --generate-notes \
            --notes 'Android 7.0(API 24)+ ARM64용 정식 서명 APK입니다. 기존 테스트 APK와 서명이 다르면 덮어쓰기 설치가 불가능합니다. SIGNING.txt에서 공개 인증서 정보를 확인하세요. 기존 앱 삭제 시 기기에 저장된 개인 목록과 메모가 삭제될 수 있습니다.'
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/follow-mz-release.jks"
