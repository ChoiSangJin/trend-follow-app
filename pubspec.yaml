name: malmun
description: Korean Netflix weekly charts and a personal watchlist.
publish_to: none
version: 4.1.0+9
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  dio: 5.9.0
  url_launcher: 6.3.2
  shared_preferences: 2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/practice.json
    - assets/conversation_guides.json
    - assets/netflix-kr.json
    - assets/anime.json
